name: SimpleCosmetics
version: '2.5'
main: me.refrac.cosmetics.Cosmetics
api-version: '1.18'
authors: [GreenArrowlol, Refrac]

libraries:
  - dev.dejvokep:boosted-yaml:1.3.5

commands:
  cosmetics:
    description: Open the trails menu or run a subcommand (menu, clear, reload, update, version, help).
    usage: /<command> [menu|clear|reload|update|version|help]

permissions:
  simplecosmetics.use:
    description: Open the trails cosmetics menu.
    default: true