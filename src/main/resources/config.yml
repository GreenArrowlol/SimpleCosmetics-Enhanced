# =====================================================================
# SimpleCosmetics Enhanced - configuration
# Auto-updated by boosted-yaml. New keys added by updates land here
# automatically; do not remove the configVersion line below.
# =====================================================================

# Internal config schema version. Used by the auto-updater to merge in
# new defaults without wiping your changes. Do not edit by hand.
configVersion: 1.3

Update:
  # If true, the plugin checks SpigotMC on startup and prints a notice
  # in the console when a newer version is available.
  Enabled: true

# Extra console-command names that should run /cosmetics.
# Applied dynamically on startup, so editing this list and running
# /cosmeticsreload (or restarting) is enough - no plugin.yml edits needed.
CommandAliases:
  - trails
  - playertrails

# All chat messages the plugin sends. Color codes (&a, &b, ...) and hex
# (&#RRGGBB) are supported. Placeholders: {trail} is replaced by the
# trail name (flame, heart, ...).
Messages:
  APPLY-TRAIL: "&aApplied the {trail} trail."
  REMOVE-TRAIL: "&cRemoved the {trail} trail."
  REMOVE-ALL-TRAILS: "&cRemoved your trail."
  NO-ACTIVE-TRAIL: "&cYou don't have an active trail."
  RELOAD: "&aConfig files reloaded. Changes should be live in-game!"
  NO-PERMISSION: "&cYou don't have permission to use this cosmetic."

TrailsMenu:
  # Inventory title shown at the top of the trails GUI.
  TITLE: "&c&lTrails Menu"
  # Number of rows in the GUI. Each row holds 9 slots, so total slots = ROWS * 9.
  # Allowed: 1-6. Make sure every SLOT below fits inside (ROWS * 9 - 1).
  # The shipped layout puts REMOVE-TRAIL at slot 31, so the default is 4 rows.
  ROWS: 4

  # Each trail entry below shares the same shape:
  #   ENABLED  - if false, the trail is hidden from the GUI and cannot be selected
  #   NAME     - item display name in the GUI (color codes / hex supported)
  #   LORE     - list of lore lines under the item name
  #   MATERIAL - Bukkit Material name (e.g. BLAZE_POWDER, REDSTONE)
  #   SLOT     - inventory slot index (0 = top-left, increases left-to-right then down)
  FLAME:
    ENABLED: true
    NAME: "&6Flame Trail"
    LORE:
      - "&7Click to apply the Flame Trail."
      - "&7This is a cool flame effect!"
    MATERIAL: "BLAZE_POWDER"
    SLOT: 0
  HEART:
    ENABLED: true
    NAME: "&6Heart Trail"
    LORE:
      - "&7Click to apply the Heart Trail."
    MATERIAL: "REDSTONE"
    SLOT: 1
  SLIME:
    ENABLED: true
    NAME: "&6Slime Trail"
    LORE:
      - "&7Click to apply the Slime Trail."
    MATERIAL: "SLIME_BALL"
    SLOT: 2
  SMOKE:
    ENABLED: true
    NAME: "&6Smoke Trail"
    LORE:
      - "&7Click to apply the Smoke Trail."
    MATERIAL: "STRING"
    SLOT: 3
  CRITICAL:
    ENABLED: true
    NAME: "&6Critical Trail"
    LORE:
      - "&7Click to apply the Critical Trail."
    MATERIAL: "FLINT"
    SLOT: 4
  NOTES:
    ENABLED: true
    NAME: "&6Notes Trail"
    LORE:
      - "&7Click to apply the Notes Trail."
    MATERIAL: "NOTE_BLOCK"
    SLOT: 5
  LAVA:
    ENABLED: true
    NAME: "&6Lava Trail"
    LORE:
      - "&7Click to apply the Lava Trail."
    MATERIAL: "LAVA_BUCKET"
    SLOT: 6
  WATER:
    ENABLED: true
    NAME: "&6Water Trail"
    LORE:
      - "&7Click to apply the Water Trail."
    MATERIAL: "WATER_BUCKET"
    SLOT: 7
  CLOUD:
    ENABLED: true
    NAME: "&6Cloud Trail"
    LORE:
      - "&7Click to apply the Cloud Trail."
    MATERIAL: "BEACON"
    SLOT: 8
  # The "clear my trail" button. No ENABLED key - it is always present.
  REMOVE-TRAIL:
    NAME: "&cRemove Trail"
    LORE:
      - "&7Remove your trail."
    MATERIAL: "BARRIER"
    SLOT: 31
